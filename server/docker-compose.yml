services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # внутри docker-сети база доступна по имени сервиса
      - MONGO_URI=mongodb://db:27017/happyhome
      - PORT=5000
    depends_on:
      - db
  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
