# Локальная разработка: сервер + MongoDB. Запуск: docker compose up
services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # внутри docker-сети база доступна по имени сервиса
      - MONGO_URI=mongodb://db:27017/happyhome
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mongo:7
    ports:
      # только для вашего компьютера: база без пароля не должна быть видна из сети
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
